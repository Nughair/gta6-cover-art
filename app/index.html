<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Cover Works — GTA-style cover-art editor</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Leonida Cover Works</h1>
    <p class="tagline">Turn a photo into GTA-style multi-panel cover art: pick a layout, grade the colour, letter the caption, export the poster.</p>

    <div class="group">
      <span class="group-label">Photo for selected panel</span>
      <label class="file">Upload a photo <input id="photo" type="file" accept="image/*"></label>
      <div class="row">
        <button type="button" data-sample="pier">Sample: Pier</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
      </div>
      <p class="hint">Click a panel on the cover to select it, then drag inside it to reposition its photo.</p>
    </div>

    <div class="group">
      <span class="group-label">Layout</span>
      <div class="row">
        <button type="button" data-layout="grid" class="active">Classic 2×2 Grid</button>
        <button type="button" data-layout="hero">Hero + Strips</button>
      </div>
    </div>

    <div class="group">
      <span class="group-label">Colour grade</span>
      <div class="row wrap">
        <button type="button" data-grade="vice" class="active">Vice Sunset</button>
        <button type="button" data-grade="neon">Neon Nights</button>
        <button type="button" data-grade="golden">Golden Hour</button>
        <button type="button" data-grade="none">Original</button>
      </div>
    </div>

    <div class="group">
      <label class="group-label" for="zoom">Panel zoom</label>
      <input id="zoom" type="range" min="1" max="2.4" step="0.01" value="1.15">
      <label class="group-label" for="caption">Caption</label>
      <input id="caption" type="text" maxlength="40" value="LEONIDA DREAMS">
    </div>

    <div class="group">
      <span class="group-label">Export PNG</span>
      <div class="row wrap">
        <button type="button" data-export="1080x1080">1080 × 1080</button>
        <button type="button" data-export="1080x1350">1080 × 1350</button>
        <button type="button" data-export="1920x1080">1920 × 1080</button>
      </div>
    </div>

    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="900" height="900" aria-label="Cover preview — click a panel to select it, drag to reposition"></canvas>
</main>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
